---
# Follow Bazzite upstream without unpinning: weekly, move the Containerfile's
# digest-pinned BASE_IMAGE to the current bazzite-nvidia-open:stable and open a
# PR. build.yml's smoke gate (and base-watch's package diff) then judge it.
# Nothing here builds or pushes an image. ci/base-bump.sh also emits an
# automerge guard decision (ci/base-bump-guard.py): only when the Fedora major
# is unchanged, the kernel is same-or-newer AND the blast-radius package diff
# between the current pin and the new base is empty (ci/base-blast-diff.sh pulls
# both digests with podman, one at a time) does this workflow arm
# `gh pr merge --auto --merge`, which merges only after the required checks go
# green. At arm time only (not re-checked at merge time) it also declines to arm
# while a release candidate workflow is in flight; a release started after
# arming is NOT blocked, so the owner must run `gh pr merge --disable-auto <n>`
# if one starts. Otherwise (major jump, kernel downgrade, any parse failure) the
# PR stays open for a human.
# Requires the repo's "Allow auto-merge" setting; without it arming fails with a
# warning and the PR simply waits for a human.
#
# Needs a BUMP_TOKEN secret (fine-grained PAT or app token: contents + pull
# requests write on this repo). A PR opened with the default GITHUB_TOKEN would
# not trigger build.yml, so the required checks would never run. Without the
# secret this workflow does nothing; base-watch's `base-bump` issue remains the
# heads-up.
name: Bump upstream base

on:
  schedule:
    - cron: '30 5 * * 6'  # 05:30 UTC Saturday — ahead of the Sunday 06:00 build
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  bump:
    name: Open base digest bump PR
    runs-on: ubuntu-24.04
    if: github.repository == 'bearyjd/bazzite-tower'
    timeout-minutes: 60  # the blast-radius diff pulls two base images
    steps:
      - name: Require BUMP_TOKEN
        env:
          HAVE_TOKEN: ${{ secrets.BUMP_TOKEN != '' }}
        run: |
          if [[ "${HAVE_TOKEN}" != "true" ]]; then
            echo "::notice::BUMP_TOKEN is not set; skipping (PRs from GITHUB_TOKEN do not trigger CI)."
            echo "skip=1" >> "${GITHUB_ENV}"
          fi

      - name: Checkout
        if: env.skip != '1'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Ensure skopeo and jq
        if: env.skip != '1'
        run: |
          if ! command -v skopeo > /dev/null || ! command -v jq > /dev/null; then
            sudo apt-get update -q
            sudo apt-get install -y -q skopeo jq
          fi

      - name: Resolve latest upstream digest
        if: env.skip != '1'
        id: bump
        run: ci/base-bump.sh

      - name: Open or reuse the bump PR
        if: env.skip != '1' && steps.bump.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.BUMP_TOKEN }}
          LATEST: ${{ steps.bump.outputs.latest }}
          CURRENT: ${{ steps.bump.outputs.current }}
          VERSION: ${{ steps.bump.outputs.version }}
          AUTOMERGE: ${{ steps.bump.outputs.automerge }}
          REASON: ${{ steps.bump.outputs.reason }}
          BLAST_REPORT: ${{ steps.bump.outputs.blast_report }}
        run: |
          set -euo pipefail
          branch="base-bump/${LATEST#sha256:}"
          branch="${branch:0:32}"
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          # Rerun-safe: push only if the branch is missing, open a PR only if
          # none (open, merged or closed) exists for it; an open one is re-armed.
          if ! git ls-remote --exit-code --heads "${remote}" "${branch}" > /dev/null; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git checkout -b "${branch}"
            git commit -am "chore(base): bump bazzite-nvidia-open to ${VERSION}"
            git push "${remote}" "${branch}"
          fi
          arm() { # $1 = PR number or branch; arm only on a positive guard and no release in flight right now
            if [[ "${AUTOMERGE}" != "true" ]]; then
              echo "Automerge not armed: ${REASON:-no guard decision}"
              return 0
            fi
            local wf n
            for wf in r13-candidate.yml r13-immutable-ci.yml release.yml; do
              n=$(gh run list --workflow "${wf}" --json status \
                --jq '[.[] | select(.status != "completed")] | length') \
                || { echo "::warning::cannot list ${wf} runs; not arming automerge"; return 0; }
              if [[ "${n}" != "0" ]]; then
                echo "::notice::${wf} has ${n} run(s) in flight; not arming automerge (rerun to re-arm). This check is made at arm time only."
                return 0
              fi
            done
            gh pr merge --auto --merge "$1" \
              || echo "::warning::could not arm auto-merge (is 'Allow auto-merge' enabled?); a human merges."
          }

          existing=$(gh pr list --head "${branch}" --state all --json number,state --jq '.[0] | select(.) | "\(.number) \(.state)"')
          if [[ -n "${existing}" ]]; then
            echo "A PR for ${branch} already exists (${existing})."
            if [[ "${existing##* }" == "OPEN" ]]; then arm "${branch}"; fi
            exit 0
          fi

          # Supersede older unmerged bump PRs: they edit the same Containerfile line.
          gh pr list --state open --json number,headRefName \
            --jq '.[] | select(.headRefName | startswith("base-bump/")) | .number' \
            | while read -r old; do
                gh pr merge --disable-auto "${old}" || true
                gh pr close "${old}" --comment "Superseded by a newer upstream digest (${branch})."
              done

          body=$(printf '%s\n' \
            "Automated weekly bump of the pinned upstream base." \
            "" \
            "- Upstream version: \`${VERSION}\`" \
            "- Automerge guard: \`${AUTOMERGE:-false}\` (${REASON:-no guard decision})" \
            "- Old digest: \`${CURRENT}\`" \
            "- New digest: \`${LATEST}\`" \
            "" \
            "## Blast-radius package diff (current pin -> new base)" \
            "" \
            "${BLAST_REPORT:-_Blast-radius diff could not be computed._}" \
            "" \
            "## Before merging" \
            "- [ ] Smoke gate and build checks green on this head" \
            "- [ ] Read the latest \`base-bump\` issue from base-watch (kernel, qemu, libvirt, NetworkManager, Docker, systemd, polkit, bootc)" \
            "- [ ] Not mid-release: merging changes the Containerfile, so do not merge between a candidate cut and its promotion. Auto-merge, if armed, does NOT re-check this at merge time; if a release starts after arming, run \`gh pr merge --disable-auto <n>\`" \
            "- [ ] Reviewed the blast-radius package diff above (qemu, libvirt, NetworkManager, systemd, polkit, bootc, kernel, Docker): auto-merge is only armed when it is empty" \
            "- [ ] Kernel unchanged or newer than the last accepted one (i915 MTL resume fix; see docs/research/i915-mtl-resume-2026-06-20.md)" \
            "" \
            "If the guard above is \`true\` (same Fedora major, kernel same-or-newer, policy floor met, empty blast-radius diff) and no release candidate run was in flight when it was armed, auto-merge is armed; the checklist items other than the release one are covered by the required checks. A release started after arming is NOT blocked. If \`false\`, this PR needs a human decision.")
          pr_url=$(gh pr create --base main --head "${branch}" \
            --title "chore(base): bump bazzite-nvidia-open to ${VERSION}" \
            --body "${body}")
          arm "${pr_url}"
