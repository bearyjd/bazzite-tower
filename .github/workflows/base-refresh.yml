      run: |-
        set -euo pipefail
        python3 control/ci/base-refresh.py baseline --control control --data "$DATA" --profile "$PROFILE" --current "$TRUST"
        gh api "repos/$GITHUB_REPOSITORY/contents/.github/base-refresh-policy.json?ref=main" -H 'Accept: application/vnd.github.raw+json' > "$RUNNER_TEMP/current-policy.json"
        python3 control/ci/base-refresh.py fresh --control control --current "$RUNNER_TEMP/current-policy.json"
        case "$PROFILE" in legacy) channels=(stable latest) ;; system) channels=(snitchwatch-system) ;; *) exit 1 ;; esac
        attempted=(); confirmed=()
        # The EXIT trap reports writes whose transport response may have been lost.
        # shellcheck disable=SC2329
        pointer_failure_summary() {
          local rc=$?
          if [[ "$rc" -ne 0 ]]; then
            echo "REFRESH_POINTER_FAILURE profile=$PROFILE expected_digest=$VALIDATED_DIGEST attempted=${attempted[*]:-none} confirmed=${confirmed[*]:-none}" >> "$GITHUB_STEP_SUMMARY"
            echo 'Tag updates are not transactional. An attempted tag may have moved even if transport failed. Rerun this workflow with the same reviewed policy to verify and repair aliases.' >> "$GITHUB_STEP_SUMMARY"
          fi
          return "$rc"
        }
        trap pointer_failure_summary EXIT
        for tag in "${channels[@]}"; do
          attempted+=("$tag")
          skopeo copy --all --preserve-digests --digestfile "$RUNNER_TEMP/$tag.digest" "docker://$DEST@$VALIDATED_DIGEST" "docker://$DEST:$tag"
          [[ "$(cat "$RUNNER_TEMP/$tag.digest")" == "$VALIDATED_DIGEST" ]]
          resolved="sha256:$(skopeo inspect --raw "docker://$DEST:$tag" | sha256sum | cut -d' ' -f1)"
          [[ "$resolved" == "$VALIDATED_DIGEST" ]]
          confirmed+=("$tag")
        done
        echo "REFRESH_PASS profile=$PROFILE digest=$VALIDATED_DIGEST base=$BASE accepted_source=dc1e070725d600a7a0aa2fe13941e9cb928457d2" >> "$GITHUB_STEP_SUMMARY"
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: refresh-receipt-system
        path: |-
          ${{ runner.temp }}/verified/
          ${{ runner.temp }}/*.digest
          ${{ runner.temp }}/data/build-provenance.json
        if-no-files-found: error
        retention-days: 30
