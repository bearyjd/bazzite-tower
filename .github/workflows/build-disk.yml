---
name: Build disk images

on:
  workflow_dispatch:
    inputs:
      upload-to-s3:
        description: "Upload to S3"
        required: false
        default: false
        type: boolean
      platform:
        required: true
        type: choice
        options:
          - amd64
          - arm64
  pull_request:
    branches:
      - main
    paths:
      - 'disk_config/disk.toml'
      - '.github/workflows/build-disk.yml'

env:
  IMAGE_NAME: ${{ github.event.repository.name }} # output of build.yml, keep in sync
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"  # do not edit
  DEFAULT_TAG: "latest"
  # Pin the builder separately from the image-under-test: :latest is mutable
  # and would make identical disk workflow revisions non-reproducible.
  BIB_IMAGE: "quay.io/centos-bootc/bootc-image-builder@sha256:2b52843ea2bfda73b0a08d97e76b734393b1d3a804681b9fabb26723bd3a2f0b"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.variant }} disk image
    runs-on: ${{ (inputs.platform || 'amd64') == 'amd64' && 'ubuntu-24.04' || 'ubuntu-24.04-arm' }}
    strategy:
      fail-fast: false
      matrix:
        # Each leg pairs a bootc-image-builder output type with its config file,
        # with a distinct variant name (used for the artifact name + S3 subpath).
        #
        # anaconda-iso is intentionally NOT built. Two open upstream bugs block a
        # usable ISO: BIB can't read the base image's file:// repo GPG keys during
        # depsolve (osbuild/bootc-image-builder#1188), and Anaconda installs of
        # Bazzite are not usable even past that (ublue-os/bazzite#3418). qcow2 is
        # the supported artifact; the primary install path is `bootc switch`. To
        # revisit ISOs, use ublue's ISO toolchain (titanoboa), not BIB anaconda-iso.
        include:
          - variant: qcow2
            type: qcow2
            config: ./disk_config/disk.toml
    permissions:
      contents: read
      packages: read
      id-token: write

    steps:
      - name: Prepare environment
        run: |
          USER_UID=$(id -u)
          USER_GID=$(id -g)
          # Concatenate the types with a hyphen
          DISK_TYPE=$(echo "${{ matrix.type }}" | tr ' ' '-')
          # Lowercase the image uri
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> ${GITHUB_ENV}
          echo "IMAGE_NAME=${IMAGE_NAME,,}" >> ${GITHUB_ENV}
          echo "DISK_TYPE=${DISK_TYPE}" >> ${GITHUB_ENV}
          echo "USER_UID=${USER_UID}" >> ${GITHUB_ENV}
          echo "USER_GID=${USER_GID}" >> ${GITHUB_ENV}

      - name: Install dependencies
        if: inputs.platform == 'arm64'
        run: |
          set -x
          sudo apt update -y
          sudo apt install -y \
            podman

      - name: Maximize build space
        if: inputs.platform != 'arm64'
        uses: ublue-os/remove-unwanted-software@cc0becac701cf642c8f0a6613bbdaf5dc36b259e # v9
        with:
          remove-codeql: true

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v2.6.3'

      # Resolve the mutable release tag once, verify that immutable manifest,
      # and pass only the verified digest to BIB. This prevents a tag move
      # between verification and the disk-image pull.
      - name: Resolve and verify source image
        id: source_image
        env:
          SOURCE_IMAGE: ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.DEFAULT_TAG }}
        run: |
          set -euo pipefail
          podman pull "${SOURCE_IMAGE}"
          resolved="$(podman image inspect --format '{{index .RepoDigests 0}}' "${SOURCE_IMAGE}")"
          case "${resolved}" in
            "${IMAGE_REGISTRY}/${IMAGE_NAME}"@sha256:*) ;;
            *) echo "::error::could not resolve ${SOURCE_IMAGE} to this repository's digest"; exit 1 ;;
          esac
          cosign verify --key cosign.pub "${resolved}"
          echo "image=${resolved}" >> "${GITHUB_OUTPUT}"

      # Run the digest-pinned BIB container directly. The third-party
      # osbuild/bootc-image-builder-action is archived, and its only job here
      # was this one `podman run`.
      - name: Build disk images
        id: build
        env:
          SOURCE_IMAGE: ${{ steps.source_image.outputs.image }}
          DISK_CONFIG: ${{ matrix.config }}
          DISK_BUILD_TYPE: ${{ matrix.type }}
        run: |
          set -euo pipefail
          output="${RUNNER_TEMP}/bib-output"
          mkdir -p "${output}"
          # GitHub Actions podman workaround, ported from the archived action
          # (osbuild/bootc-image-builder#446): reset rootful storage and force
          # the overlay driver before anything is pulled into it.
          sudo rm -rf /var/lib/containers/storage
          sudo mkdir -p /etc/containers
          printf '%s\n' '[storage]' 'driver = "overlay"' \
            'runroot = "/run/containers/storage"' \
            'graphroot = "/var/lib/containers/storage"' |
            sudo tee /etc/containers/storage.conf >/dev/null
          # BIB reads the source image from rootful storage; the verified
          # digest ref is pulled there, never a mutable tag.
          sudo podman pull "${SOURCE_IMAGE}"
          # --rootfs btrfs: the bazzite-nvidia base declares no default root
          # filesystem, so BIB aborts manifest generation without it.
          sudo podman run \
            --rm \
            --privileged \
            --net=host \
            --security-opt label=type:unconfined_t \
            -v "${GITHUB_WORKSPACE}/${DISK_CONFIG}:/config.toml:ro" \
            -v "${output}:/output" \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            "${BIB_IMAGE}" \
            build \
            --output /output \
            --type "${DISK_BUILD_TYPE}" \
            --rootfs btrfs \
            --use-librepo=True \
            "${SOURCE_IMAGE}"
          sudo chown -R "${USER_UID}:${USER_GID}" "${output}"
          echo "output-directory=${output}" >> "${GITHUB_OUTPUT}"

      - name: Upload disk images and Checksum to Job Artifacts
        if: inputs.upload-to-s3 != true && github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.IMAGE_NAME }}-${{ matrix.variant }}
          path: ${{ steps.build.outputs.output-directory }}
          if-no-files-found: error
          retention-days: 0
          compression-level: 0
          overwrite: true
      
      - name: Upload to S3
        if: inputs.upload-to-s3 == true && github.event_name != 'pull_request'
        shell: bash
        env:
          RCLONE_CONFIG_S3_TYPE: s3
          RCLONE_CONFIG_S3_PROVIDER: ${{ secrets.S3_PROVIDER }}
          RCLONE_CONFIG_S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          RCLONE_CONFIG_S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_S3_REGION: ${{ secrets.S3_REGION }}
          RCLONE_CONFIG_S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          SOURCE_DIR: ${{ steps.build.outputs.output-directory }}
        run: |
          sudo apt-get update
          sudo apt-get install -y rclone
          rclone copy $SOURCE_DIR S3:${{ secrets.S3_BUCKET_NAME }}/${{ matrix.variant }}
