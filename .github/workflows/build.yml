---
name: Build container image
on:
  pull_request:
    branches:
      - main
  schedule:
    - cron: '0 6 * * 0'  # 06:00 UTC every Sunday
  push:
    branches:
      - main
    paths-ignore:
      - '**/README.md'
      - 'docs/**'
  workflow_dispatch:

env:
  IMAGE_DESC: "Bazzite desktop + QEMU/libvirt/Docker for ThinkPad P1"
  IMAGE_KEYWORDS: "bootc,ublue,universal-blue,bazzite,virtualization"
  IMAGE_LOGO_URL: "https://avatars.githubusercontent.com/u/120078124?s=200&v=4"  # Put your own image here for a fancy profile on https://artifacthub.io/!
  IMAGE_NAME: "${{ github.event.repository.name }}"  # output image name, usually same as repo name
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"  # do not edit
  DEFAULT_TAG: "latest"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}-${{ inputs.brand_name}}-${{ inputs.stream_name }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify image (${{ matrix.variant }})
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04

    # Pull requests receive no token capable of publishing, attesting, signing,
    # or filing issues. This job builds and exercises its own local candidate.
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: safe-pin
            build_args: ""
            tag_base: verify-safe-pin
          - variant: latest-kernel
            build_args: "BASE_IMAGE=ghcr.io/ublue-os/bazzite-nvidia-open:stable"
            tag_base: verify-latest-kernel

    steps:
      - name: Prepare environment
        run: |
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> ${GITHUB_ENV}
          echo "IMAGE_NAME=${IMAGE_NAME,,}" >> ${GITHUB_ENV}

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6

      - name: Validate source safety contracts
        run: |
          tests/check-supply-chain.sh
          tests/test-rpm-inventory-spdx.sh
          tests/test-firstboot-no-docker.sh
          tests/test-tower-health.sh
          tests/test-container-templates.sh
          tests/test-docker-libvirt-forwarding.sh
          tests/test-docker-libvirt-forwarding-hooks.sh

      # A local-only tag avoids metadata/publish semantics while ensuring the
      # smoke and runtime checks exercise the exact image this job built.
      - name: Build image
        uses: redhat-actions/buildah-build@3a51aade9afa17e5c78256bcbe2e1ee08c7b995b # v3.0.2
        with:
          containerfiles: |
            ./Containerfile
          image: ${{ env.IMAGE_NAME }}
          tags: ${{ matrix.tag_base }}
          build-args: |
            ${{ matrix.build_args }}
          oci: false
          squash: false

      - name: Smoke test built image
        run: podman run --rm -i "${IMAGE_NAME}:${TAG_BASE}" bash -s < tests/smoke.sh
        env:
          TAG_BASE: ${{ matrix.tag_base }}

      - name: Runtime test built image
        run: |
          set -uo pipefail
          container="bzverify-${{ matrix.variant }}"
          cleanup() { podman rm -f "${container}" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          podman run -d --name "${container}" --privileged --systemd=always \
            "${IMAGE_NAME}:${TAG_BASE}" /sbin/init
          booted=
          for i in $(seq 1 90); do
            state="$(podman exec "${container}" systemctl is-system-running 2>/dev/null || true)"
            echo "[${i}] is-system-running: ${state:-<none>}"
            case "${state}" in running|degraded) booted=1; break ;; esac
            sleep 2
          done
          if [[ -z "${booted}" ]]; then
            echo "::error::image systemd never reached running/degraded"
            podman exec "${container}" journalctl --no-pager -n 120 2>/dev/null || podman logs "${container}" || true
            exit 1
          fi
          podman cp tests/boot-check.sh "${container}":/usr/local/bin/boot-check.sh
          podman exec "${container}" chmod +x /usr/local/bin/boot-check.sh
          set +e
          podman exec "${container}" /usr/local/bin/boot-check.sh
          rc=$?
          set -e
          podman exec "${container}" journalctl --no-pager -n 80 \
            -u virtqemud.service -u virtqemud.socket \
            -u bazzite-tower-wifi-backend-guard.service 2>/dev/null || true
          exit "${rc}"
        env:
          TAG_BASE: ${{ matrix.tag_base }}

  release:
    name: Build, verify, and release image (${{ matrix.variant }})
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04

    permissions:
      attestations: write
      artifact-metadata: write
      contents: read
      packages: write
      id-token: write
      issues: write   # open/close a tracking issue when the gate fails

    # Exposed as env so step `if:` guards can test for its presence — the
    # `secrets` context is not available directly inside `if:` expressions.
    env:
      SIGNING_SECRET: ${{ secrets.SIGNING_SECRET }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # Default/primary — what `bootc upgrade` pulls with no explicit tag.
          # Pinned base comes exclusively from the Containerfile's BASE_IMAGE
          # default. Do not add a build arg here: that would create a second,
          # mutable source of truth. tag_prefix empty => tag strings below are byte-identical
          # to this workflow's pre-matrix behavior (no disruption to existing
          # installs or anyone pinned to a `:<date>`/`:<sha>` tag).
          # As of 2026-08-28 this is bazzite-nvidia-open (NVIDIA open kernel
          # modules) — moved off proprietary bazzite-nvidia because that
          # flavor forked onto a kernel track (`ogc-lts`, 6.18.x) that will
          # not receive the i915 cx0 s2idle-resume fix; see the Containerfile
          # comment and docs/research/i915-bug-report/UPSTREAM-FIX-STATUS-2026-08-28.md.
          - variant: safe-pin
            build_args: ""
            tag_base: latest
            tag_prefix: ""
          # Opt-in — tracks upstream bazzite-nvidia-open:stable's current
          # kernel/driver, for early warning of the next upstream surprise
          # before it reaches the pinned safe-pin leg. Never the default tag;
          # every tag this leg produces is namespaced under tag_prefix so it
          # can never collide with the safe-pin leg's pushed tags.
          - variant: latest-kernel
            build_args: "BASE_IMAGE=ghcr.io/ublue-os/bazzite-nvidia-open:stable"
            tag_base: latest-kernel
            tag_prefix: "latest-kernel-"

    steps:
      - name: Prepare environment
        run: |
          # Lowercase the image uri
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> ${GITHUB_ENV}
          echo "IMAGE_NAME=${IMAGE_NAME,,}" >> ${GITHUB_ENV}

      # These stage versions are pinned by https://github.com/renovatebot/renovate
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      # This is optional, but if you see that your builds are way too big for the runners, you can enable this by uncommenting the following lines:
      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6

      - name: Validate source safety contracts
        run: |
          tests/check-supply-chain.sh
          tests/test-rpm-inventory-spdx.sh
          tests/test-firstboot-no-docker.sh
          tests/test-tower-health.sh
          tests/test-container-templates.sh
          tests/test-docker-libvirt-forwarding.sh
          tests/test-docker-libvirt-forwarding-hooks.sh

      - name: Get current date
        id: date
        run: |
          # This generates a timestamp like what is defined on the ArtifactHub documentation
          # E.G: 2022-02-08T15:38:15Z'
          # https://artifacthub.io/docs/topics/repositories/container-images/
          # https://linux.die.net/man/1/date
          echo "date=$(date -u +%Y\-%m\-%d\T%H\:%M\:%S\Z)" >> $GITHUB_OUTPUT

      # Image metadata for https://artifacthub.io/ - This is optional but is highly recommended so we all can get a index of all the custom images
      # The metadata by itself is not going to do anything, you choose if you want your image to be on ArtifactHub or not.
      - name: Image Metadata
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6.1.0
        id: metadata
        with:
          # tag_prefix is "" for the safe-pin leg, so these four lines produce
          # exactly the pre-matrix tag strings for that leg (latest,
          # latest.$date, $date, $sha). The latest-kernel leg gets everything
          # namespaced under "latest-kernel-" so it can never collide with a
          # safe-pin tag in the registry.
          tags: |
            type=raw,value=${{ matrix.tag_base }}
            type=raw,value=${{ matrix.tag_base }}.{{date 'YYYYMMDD'}}
            type=raw,value=${{ matrix.tag_prefix }}{{date 'YYYYMMDD'}}
            type=sha,prefix=${{ matrix.tag_prefix }},format=short
            type=ref,event=pr,prefix=${{ matrix.tag_prefix }}pr-
          labels: |
            io.artifacthub.package.readme-url=https://raw.githubusercontent.com/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}/${{ github.sha }}/README.md
            org.opencontainers.image.created=${{ steps.date.outputs.date }}
            org.opencontainers.image.description=${{ env.IMAGE_DESC }}
            org.opencontainers.image.documentation=https://raw.githubusercontent.com/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}/${{ github.sha }}/README.md
            org.opencontainers.image.source=https://github.com/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}/blob/${{ github.sha }}/Containerfile
            org.opencontainers.image.title=${{ env.IMAGE_NAME }}
            org.opencontainers.image.url=https://github.com/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}/tree/${{ github.sha }}
            org.opencontainers.image.vendor=${{ github.repository_owner }}
            org.opencontainers.image.version=${{ matrix.tag_base }}.{{date 'YYYYMMDD'}}
            io.artifacthub.package.deprecated=false
            io.artifacthub.package.keywords=${{ env.IMAGE_KEYWORDS }}
            io.artifacthub.package.license=Apache-2.0
            io.artifacthub.package.logo-url=${{ env.IMAGE_LOGO_URL }}
            io.artifacthub.package.prerelease=false
            containers.bootc=1
          sep-tags: " "
          sep-annotations: " "

      - name: Build Image
        id: build_image
        uses: redhat-actions/buildah-build@3a51aade9afa17e5c78256bcbe2e1ee08c7b995b # v3.0.2
        with:
          containerfiles: |
            ./Containerfile
          # Postfix image name with -custom to make it a little more descriptive
          # Syntax: https://docs.github.com/en/actions/learn-github-actions/expressions#format
          image: ${{ env.IMAGE_NAME }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: |
            ${{ matrix.build_args }}
          oci: false
          # Pinned explicitly because buildah-build v3.0.0 flipped this default
          # from false to true. Squashing collapses the image into one layer,
          # which is precisely what the (currently disabled) Rechunker step below
          # exists to avoid — a single huge layer costs resumability on every
          # `bootc upgrade` pull. Inheriting the new default would have changed
          # published image layering silently, with no smoke-test assertion to
          # catch it. Keep this line even if it looks redundant.
          squash: false

      # ── Promotion gate ──────────────────────────────────────────────────────
      # Run offline assertions against the freshly built (not-yet-pushed) image.
      # This step sits BEFORE login/push, so a failure here means the broken
      # image is never published: the `:latest` tag the laptop tracks stays on
      # the last-good image, and the issue-on-failure step below alerts us.
      # Runs on PRs too (red check, no issue) so regressions surface pre-merge.
      - name: Smoke test built image
        run: |
          podman run --rm -i "${IMAGE_NAME}:${TAG_BASE}" bash -s < tests/smoke.sh
        env:
          TAG_BASE: ${{ matrix.tag_base }}

      # This is deliberately in the release job, not a separate workflow: it
      # exercises the exact local candidate that will be promoted below. The
      # PR-only verify job independently rebuilds and runs its own equivalent
      # check with no registry credentials.
      - name: Runtime test built image
        run: |
          set -uo pipefail
          container="bztest-${{ matrix.variant }}"
          cleanup() { podman rm -f "${container}" >/dev/null 2>&1 || true; }
          trap cleanup EXIT

          podman run -d --name "${container}" --privileged --systemd=always \
            "${IMAGE_NAME}:${TAG_BASE}" /sbin/init

          booted=
          for i in $(seq 1 90); do
            state="$(podman exec "${container}" systemctl is-system-running 2>/dev/null || true)"
            echo "[${i}] is-system-running: ${state:-<none>}"
            case "${state}" in
              running|degraded) booted=1; break ;;
            esac
            sleep 2
          done

          if [[ -z "${booted}" ]]; then
            echo "::error::image systemd never reached running/degraded"
            podman exec "${container}" journalctl --no-pager -n 120 2>/dev/null || podman logs "${container}" || true
            exit 1
          fi

          podman cp tests/boot-check.sh "${container}":/usr/local/bin/boot-check.sh
          podman exec "${container}" chmod +x /usr/local/bin/boot-check.sh
          set +e
          podman exec "${container}" /usr/local/bin/boot-check.sh
          rc=$?
          set -e
          podman exec "${container}" journalctl --no-pager -n 80 \
            -u virtqemud.service -u virtqemud.socket \
            -u bazzite-tower-wifi-backend-guard.service 2>/dev/null || true
          exit "${rc}"
        env:
          TAG_BASE: ${{ matrix.tag_base }}

      # Rechunk is a script that we use on Universal Blue to make sure there isnt a single huge layer when your image gets published.
      # This does not make your image faster to download, just provides better resumability and fixes a few errors.
      # Documentation for Rechunk is provided on their github repository at https://github.com/hhd-dev/rechunk
      # You can enable it by uncommenting the following lines:
      # - name: Run Rechunker
      #   id: rechunk
      #   uses: ublue-os/legacy-rechunk@a925083d9af7cb04b3e2a6e8c01bfa495f38b710 # v1.0.0
      #   with:
      #     rechunk: 'ghcr.io/ublue-os/legacy-rechunk:v1.0.0-x86_64'
      #     ref: "localhost/${{ env.IMAGE_NAME }}:${{ env.DEFAULT_TAG }}"
      #     prev-ref: "${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.DEFAULT_TAG }}"
      #     skip_compression: true
      #     version: ${{ env.CENTOS_VERSION }}
      #     labels: ${{ steps.metadata.outputs.labels }} # Rechunk strips out all the labels during build, this needs to be reapplied here with newline separator

      # This is necessary so that the podman socket can find the rechunked image on its storage
      # - name: Load in podman and tag
      #   run: |
      #     IMAGE=$(podman pull ${{ steps.rechunk.outputs.ref }})
      #     sudo rm -rf ${{ steps.rechunk.outputs.output }}
      #     for tag in ${{ steps.metadata.outputs.tags }}; do
      #       podman tag $IMAGE ${{ env.IMAGE_NAME }}:$tag
      #     done

      # These `if` statements are so that pull requests for your custom images do not make it publish any packages under your name without you knowing
      # They also check if the runner is on the default branch so that things like the merge queue (if you enable it), are going to work
      - name: Require release signing key
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        run: |
          if [[ -z "${SIGNING_SECRET}" ]]; then
            echo "::error::SIGNING_SECRET is required to publish a release image."
            exit 1
          fi

      - name: Login to GitHub Container Registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Publish an unreferenced-by-users candidate first. Public tags remain on
      # their last verified digest until every signing and attestation check
      # below succeeds.
      - name: Tag release candidate
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        run: podman tag "${IMAGE_NAME}:${TAG_BASE}" "${IMAGE_NAME}:${CANDIDATE_TAG}"
        env:
          TAG_BASE: ${{ matrix.tag_base }}
          CANDIDATE_TAG: candidate-${{ github.run_id }}-${{ matrix.variant }}

      # This is an installed-RPM inventory, not a whole-filesystem or language
      # dependency catalog. Query the just-tested local candidate before its
      # first push, so the later signed predicate remains bound to its digest.
      - name: Generate SPDX installed-RPM inventory from local candidate
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        timeout-minutes: 3
        run: |
          set -euo pipefail
          candidate="${IMAGE_NAME}:${CANDIDATE_TAG}"
          inventory="${RUNNER_TEMP}/bazzite-tower-${{ matrix.variant }}.rpms.tsv"
          sbom="${RUNNER_TEMP}/bazzite-tower-${{ matrix.variant }}.spdx.json"
          created="$(git log -1 --format=%cI "${GITHUB_SHA}")"

          podman run --rm --entrypoint /usr/bin/rpm "${candidate}" \
            -qa --qf '%{NAME}\t%{EPOCHNUM}\t%{VERSION}\t%{RELEASE}\t%{ARCH}\n' > "${inventory}"
          python3 ci/rpm-inventory-spdx.py --input "${inventory}" --output "${sbom}" \
            --created "${created}"
          test -s "${sbom}"
          jq -e 'type == "object" and (.spdxVersion | type == "string" and startswith("SPDX-")) and (.packages | type == "array" and length > 0) and (.relationships | type == "array") and ((.relationships | length) == (.packages | length))' "${sbom}" >/dev/null
          [[ "$(wc -l < "${inventory}")" -eq "$(jq '.packages | length' "${sbom}")" ]]
        env:
          CANDIDATE_TAG: candidate-${{ github.run_id }}-${{ matrix.variant }}

      - name: Push candidate to GHCR
        uses: redhat-actions/push-to-registry@94ade333c38ecc0e60e94785125d9a52ca423b37 # v3.0.0
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        id: push_candidate
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ github.token }}
        with:
          registry: ${{ env.IMAGE_REGISTRY }}
          image: ${{ env.IMAGE_NAME }}
          tags: candidate-${{ github.run_id }}-${{ matrix.variant }}
          username: ${{ env.REGISTRY_USER }}
          password: ${{ env.REGISTRY_PASSWORD }}

      # Image signing is mandatory for every default-branch release. PRs never
      # push and therefore need neither registry nor signing credentials. The
      # image is signed by digest. Do not replace the key in place: rotation
      # requires a staged dual-key, dual-signing transition; see RUNBOOK.md.
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        with:
          cosign-release: 'v2.6.3'

      - name: Sign container image
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        run: |
          # Sign the immutable digest once, not each mutable tag.
          cosign sign -y --key env://COSIGN_PRIVATE_KEY \
            "${IMAGE_REGISTRY}/${IMAGE_NAME}@${DIGEST}"
        env:
          DIGEST: ${{ steps.push_candidate.outputs.digest }}
          COSIGN_EXPERIMENTAL: false
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          COSIGN_PASSWORD: ""

      - name: Attach signed SBOM attestation
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        run: |
          cosign attest -y --key env://COSIGN_PRIVATE_KEY --type spdxjson \
            --predicate "${SBOM}" "${IMAGE_REGISTRY}/${IMAGE_NAME}@${DIGEST}"
        env:
          DIGEST: ${{ steps.push_candidate.outputs.digest }}
          SBOM: ${{ runner.temp }}/bazzite-tower-${{ matrix.variant }}.spdx.json
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          COSIGN_PASSWORD: ""

      - name: Verify signed image and SBOM
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        run: |
          image="${IMAGE_REGISTRY}/${IMAGE_NAME}@${DIGEST}"
          cosign verify --key cosign.pub "${image}"
          cosign verify-attestation --key cosign.pub --type spdxjson "${image}"
        env:
          DIGEST: ${{ steps.push_candidate.outputs.digest }}

      - name: Attest build provenance
        uses: actions/attest-build-provenance@9d57eef8c06cd9d6b433effeeb7a6a77b3ff94ad # main
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        with:
          subject-name: ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push_candidate.outputs.digest }}
          push-to-registry: true

      - name: Verify GitHub provenance
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        run: gh attestation verify "oci://${IMAGE_REGISTRY}/${IMAGE_NAME}@${DIGEST}" --repo "${GITHUB_REPOSITORY}"
        env:
          DIGEST: ${{ steps.push_candidate.outputs.digest }}
          GH_TOKEN: ${{ github.token }}

      # Re-pull by the already signed remote digest before creating local public
      # tags. Promotion therefore cannot use a mutable candidate tag or a stale
      # local image reference.
      - name: Prepare verified digest for promotion
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        run: |
          set -euo pipefail
          candidate="${IMAGE_REGISTRY}/${IMAGE_NAME}@${DIGEST}"
          podman pull "${candidate}"
          for tag in ${TAGS}; do
            podman tag "${candidate}" "${IMAGE_NAME}:${tag}"
          done
        env:
          DIGEST: ${{ steps.push_candidate.outputs.digest }}
          TAGS: ${{ steps.metadata.outputs.tags }}

      - name: Promote verified candidate tags
        uses: redhat-actions/push-to-registry@94ade333c38ecc0e60e94785125d9a52ca423b37 # v3.0.0
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        id: promote
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ github.token }}
        with:
          registry: ${{ env.IMAGE_REGISTRY }}
          image: ${{ env.IMAGE_NAME }}
          tags: ${{ steps.metadata.outputs.tags }}
          username: ${{ env.REGISTRY_USER }}
          password: ${{ env.REGISTRY_PASSWORD }}

      - name: Verify promoted digest
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        run: |
          [[ "${PROMOTED_DIGEST}" == "${CANDIDATE_DIGEST}" ]] || {
            echo "::error::promotion digest ${PROMOTED_DIGEST} did not match verified candidate ${CANDIDATE_DIGEST}"
            exit 1
          }
        env:
          CANDIDATE_DIGEST: ${{ steps.push_candidate.outputs.digest }}
          PROMOTED_DIGEST: ${{ steps.promote.outputs.digest }}

      # ── Notification: open/refresh a tracking issue when the gate fails ───────
      # PR failures already show as a red check on the PR, so only file an issue
      # for push/schedule runs on the default branch. Deduplicated by the
      # `ci-failure` label: comment on the existing open issue instead of opening
      # a second one. (GitHub also emails the cron's last editor on a scheduled
      # failure, so this is the tracked, in-repo complement to that.)
      - name: Open tracking issue on failure
        if: failure() && github.event_name != 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          # Labelled per matrix leg: with two independent legs (fail-fast:
          # false), one leg's success must never auto-close an issue the
          # OTHER leg opened — a shared label would do exactly that.
          script: |
            const label = 'ci-failure-${{ matrix.variant }}';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const tagBase = '${{ matrix.tag_base }}';
            const body = [
              `The **${context.workflow}** workflow failed on \`${context.ref}\` (commit \`${context.sha.slice(0,7)}\`, event \`${context.eventName}\`, matrix leg \`${{ matrix.variant }}\`).`,
              ``,
              `Run: ${runUrl}`,
              ``,
              `This usually means an upstream Bazzite change broke the build or release verification (smoke/runtime gate, signature, SBOM, or provenance). The public \`:${tagBase}\` tag was **not** promoted and stays on the last-good image.`,
              ``,
              `See \`docs/downstream-change-tracking.md\` for the failure model and which area each check maps to.`,
            ].join('\n');
            const { owner, repo } = context.repo;
            const existing = await github.rest.issues.listForRepo({ owner, repo, state: 'open', labels: label });
            if (existing.data.length > 0) {
              await github.rest.issues.createComment({ owner, repo, issue_number: existing.data[0].number, body });
            } else {
              await github.rest.issues.create({ owner, repo, title: `🚨 Image build/smoke gate failing (${tagBase})`, labels: [label], body });
            }

      # Close the tracking issue once the gate is green again on the default
      # branch, so an open `ci-failure-<variant>` issue always means "that
      # variant is currently broken" — scoped per leg for the same reason
      # the open step above is.
      - name: Close tracking issue on success
        if: success() && github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const label = 'ci-failure-${{ matrix.variant }}';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const { owner, repo } = context.repo;
            const open = await github.rest.issues.listForRepo({ owner, repo, state: 'open', labels: label });
            for (const issue of open.data) {
              await github.rest.issues.createComment({ owner, repo, issue_number: issue.number, body: `Gate is green again on \`${context.ref}\` (${runUrl}). Closing.` });
              await github.rest.issues.update({ owner, repo, issue_number: issue.number, state: 'closed' });
            }
