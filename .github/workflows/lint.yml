---
# Advisory lint gate: runs the existing Justfile recipes (`just lint` =
# shellcheck, `just lint-containerfile` = hadolint pinned by digest in the
# Justfile). continue-on-error keeps findings from blocking merges until the
# baseline is confirmed stable across a hadolint repin; flip to blocking later.
name: Lint

on:
  pull_request:
    branches:
      - main
    paths:
      - 'Containerfile*'
      - '**.sh'
      - 'Justfile'
      - '.github/workflows/lint.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install just
        env:
          JUST_VERSION: "1.40.0"
          JUST_SHA256: 181b91d0ceebe8a57723fb648ed2ce1a44d849438ce2e658339df4f8db5f1263
        run: |
          set -euo pipefail
          curl -fsSL -o just.tgz "https://github.com/casey/just/releases/download/${JUST_VERSION}/just-${JUST_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          echo "${JUST_SHA256}  just.tgz" | sha256sum -c -
          sudo tar -xzf just.tgz -C /usr/local/bin just
          rm just.tgz
          just --version

      - name: shellcheck (just lint)
        continue-on-error: true
        run: just lint

      - name: hadolint (just lint-containerfile)
        continue-on-error: true
        run: just lint-containerfile
