# Primary-reviewed immutable workflow heads are mandatory; unset variables HOLD.
permissions: {}
concurrency:
  group: bazzite-tower-stable-writers
  cancel-in-progress: false
defaults:
  run:
    shell: bash
name: r13 candidate image
'on':
  push:
    branches:
    - ci/r13-candidate-hold-promotion
  workflow_dispatch: {}
jobs:
  approval:
    if: github.repository == 'bearyjd/bazzite-tower' && github.ref == 'refs/heads/ci/r13-candidate-hold-promotion' && vars.R13_CANDIDATE_HEAD != '' && github.sha == vars.R13_CANDIDATE_HEAD && vars.R13_CONTROL_HEAD != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    env:
      R13_CONTROL_HEAD: ${{ vars.R13_CONTROL_HEAD }}
      R13_CANDIDATE_HEAD: ${{ vars.R13_CANDIDATE_HEAD }}
    steps:
    - name: Require immutable externally reviewed workflow/control heads
      run: |
        set -euo pipefail
        [[ "$R13_CONTROL_HEAD" =~ ^[0-9a-f]{40}$ ]]
        [[ "$R13_CANDIDATE_HEAD" =~ ^[0-9a-f]{40}$ ]]
    - name: Checkout primary-reviewed control data only
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        ref: ${{ vars.R13_CONTROL_HEAD }}
        path: control
        persist-credentials: false
    - name: Validate independently reviewed candidate authority
      run: python3 control/ci/r13-publication.py approval --control control
  build:
    needs: approval
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      R13_CONTROL_HEAD: ${{ vars.R13_CONTROL_HEAD }}
      R13_CANDIDATE_HEAD: ${{ vars.R13_CANDIDATE_HEAD }}
      PYTHONDONTWRITEBYTECODE: '1'
    outputs:
      artifact_id: ${{ steps.artifact.outputs.artifact-id }}
    steps:
    - name: Require immutable externally reviewed workflow/control heads
      run: |
        set -euo pipefail
        [[ "$R13_CONTROL_HEAD" =~ ^[0-9a-f]{40}$ ]]
        [[ "$R13_CANDIDATE_HEAD" =~ ^[0-9a-f]{40}$ ]]
    - name: Checkout primary-reviewed control data only
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        ref: ${{ vars.R13_CONTROL_HEAD }}
        path: control
        persist-credentials: false
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        ref: ${{ github.sha }}
        path: source
        persist-credentials: false
    - name: Require exact reviewed clean source/tree/pins
      run: python3 control/ci/r13-publication.py source --control control --source source
    - uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6
    - name: Install OCI data transport
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y skopeo python3-yaml
    - name: Validate source contracts
      run: |
        tests/check-supply-chain.sh
        tests/test-rpm-inventory-spdx.sh
        python3 tests/test-r13-publication.py
        python3 tests/test-base-refresh.py
        tests/test-snitchwatch-system.sh
        tests/test-snitchwatch-toolchain.sh
        python3 tests/test-snitchwatch-image-build.py
        python3 tests/test-snitchwatch-image-build-daemon.py
      working-directory: source
    - name: Recheck exact source after source contract tests
      run: python3 control/ci/r13-publication.py source --control control --source source
    - name: Build credential-free system image
      uses: redhat-actions/buildah-build@3a51aade9afa17e5c78256bcbe2e1ee08c7b995b
      with:
        context: source
        containerfiles: source/Containerfile
        image: bazzite-tower
        tags: r13-build
        build-args: |-
          FIREWALL_DAEMON=opensnitch
          SNITCHWATCH_BRIDGE=system
          IMAGE_TAG=snitchwatch-system
        oci: true
        squash: false
    - name: Smoke exact candidate image
      run: podman run --rm -i localhost/bazzite-tower:r13-build bash -s < source/tests/smoke.sh
    - name: Read-only systemd/boot gate
      run: |
        set -uo pipefail
        container="bzverify-r13-candidate"
        # EXIT trap invokes cleanup.
        # shellcheck disable=SC2329
        cleanup() { podman rm -f "${container}" >/dev/null 2>&1 || true; }
        trap cleanup EXIT
        podman run -d --name "${container}" --privileged --systemd=always \
          "localhost/bazzite-tower:r13-build" /sbin/init
        booted=
        for i in $(seq 1 90); do
          state="$(podman exec "${container}" systemctl is-system-running 2>/dev/null || true)"
          echo "[${i}] is-system-running: ${state:-<none>}"
          case "${state}" in running|degraded) booted=1; break ;; esac
          sleep 2
        done
        if [[ -z "${booted}" ]]; then
          echo "::error::image systemd never reached running/degraded"
          podman exec "${container}" journalctl --no-pager -n 120 2>/dev/null || podman logs "${container}" || true
          exit 1
        fi
        podman cp tests/boot-check.sh "${container}":/usr/local/bin/boot-check.sh
        podman exec "${container}" chmod +x /usr/local/bin/boot-check.sh
        set +e
        podman exec "${container}" /usr/local/bin/boot-check.sh
        rc=$?
        set -e
        podman exec "${container}" journalctl --no-pager -n 80 \
          -u virtqemud.service -u virtqemud.socket \
          -u bazzite-tower-wifi-backend-guard.service 2>/dev/null || true
        exit "${rc}"
      working-directory: source
    - name: Capture installed binaries/manifests, RPM inventory and unchanged OCI data
      run: python3 control/ci/r13-candidate-data.py --source source --control control --out "$RUNNER_TEMP/r13-data"
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: r13-image-data
        path: ${{ runner.temp }}/r13-data/
        if-no-files-found: error
        retention-days: 30
        compression-level: 0
      id: artifact
  validate:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    env:
      R13_CONTROL_HEAD: ${{ vars.R13_CONTROL_HEAD }}
      R13_CANDIDATE_HEAD: ${{ vars.R13_CANDIDATE_HEAD }}
    outputs:
      digest: ${{ steps.validate.outputs.digest }}
      hashes: ${{ steps.validate.outputs.hashes }}
      head: ${{ steps.validate.outputs.head }}
      run_id: ${{ steps.validate.outputs.run_id }}
    steps:
    - name: Require immutable externally reviewed workflow/control heads
      run: |
        set -euo pipefail
        [[ "$R13_CONTROL_HEAD" =~ ^[0-9a-f]{40}$ ]]
        [[ "$R13_CANDIDATE_HEAD" =~ ^[0-9a-f]{40}$ ]]
    - name: Checkout primary-reviewed control data only
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        ref: ${{ vars.R13_CONTROL_HEAD }}
        path: control
        persist-credentials: false
    - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
      with:
        path: ${{ runner.temp }}/data
        artifact-ids: ${{ needs.build.outputs.artifact_id }}
    - name: Revalidate builder output as data using trusted control gate
      run: python3 control/ci/r13-publication.py candidate --control control --data "$RUNNER_TEMP/data"
      id: validate
  publish:
    needs:
    - build
    - validate
    if: github.repository == 'bearyjd/bazzite-tower' && github.ref == 'refs/heads/ci/r13-candidate-hold-promotion' && vars.R13_CANDIDATE_HEAD != '' && github.sha == vars.R13_CANDIDATE_HEAD && vars.R13_CONTROL_HEAD != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      packages: write
      attestations: write
      artifact-metadata: write
      id-token: write
    steps:
    - name: Install data transport
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y skopeo python3-yaml
    - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
      with:
        path: ${{ runner.temp }}/data
        artifact-ids: ${{ needs.build.outputs.artifact_id }}
    - name: Revalidate bounded artifact bytes and fixed repository policy
      run: |
        python3 - <<'PY'
        import hashlib,json,os,pathlib,re,stat
        root=pathlib.Path(os.environ['DATA'])
        expected=json.loads(os.environ['HASHES'])
        files={'image.oci.tar','candidate.json','sbom.json','build-provenance.json','bridge-manifest.json','daemon-manifest.json','cosign.pub','policy.json','bazzite-tower.yaml'}
        assert set(expected)==files and set(p.name for p in root.iterdir())==files
        for name,value in expected.items():
            assert isinstance(value,str) and re.fullmatch('[0-9a-f]{64}',value)
            p=root/name
            assert not p.is_symlink() and p.is_file()
            assert p.stat().st_size <= (40*1024**3 if name=='image.oci.tar' else 16*1024**2)
            with p.open('rb') as f: assert hashlib.file_digest(f,'sha256').hexdigest()==value
        assert re.fullmatch('sha256:[0-9a-f]{64}',os.environ['DIGEST'])
        trust=pathlib.Path(os.environ['RUNNER_TEMP'])/'r13-trust'
        trust.mkdir()
        (trust/'registries.d').mkdir()
        key=root/'cosign.pub'
        policy=json.loads((root/'policy.json').read_bytes())
        assert policy['default']==[{'type':'reject'}]
        rule=policy['transports']['docker']['ghcr.io/bearyjd/bazzite-tower']
        assert rule==[{'type':'sigstoreSigned','keyPath':'/etc/pki/containers/bazzite-tower-cosign.pub','signedIdentity':{'type':'matchRepository'}}]
        rule[0]['keyPath']=str(key)
        # Job-local candidate policy is scoped to the fixed candidate package only;
        # the installed host/stable policy is never edited.
        repo='ghcr.io/bearyjd/bazzite-tower' if os.environ['MODE']=='stable' else 'ghcr.io/bearyjd/bazzite-tower-r13-candidate'
        (trust/'policy.json').write_text(json.dumps({'default':[{'type':'reject'}],'transports':{'docker':{repo:rule}}}))
        (trust/'registries.d/repository.yaml').write_text('docker:\n  '+repo+':\n    use-sigstore-attachments: true\n')
        PY
      env:
        DIGEST: ${{ needs.validate.outputs.digest }}
        DATA: ${{ runner.temp }}/data
        HASHES: ${{ needs.validate.outputs.hashes }}
        MODE: candidate
    - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
      with:
        cosign-release: v2.6.3
    - uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ github.token }}
    - name: Stage unchanged digest at fixed nonpublic-by-convention tag
      run: |
        set -euo pipefail
        skopeo copy --all --preserve-digests --digestfile "$RUNNER_TEMP/staged.digest" \
          "oci-archive:$DATA/image.oci.tar:r13-build" "docker://ghcr.io/bearyjd/bazzite-tower-r13-candidate:r13-candidate-${{ github.run_id }}"
        [[ "$(cat "$RUNNER_TEMP/staged.digest")" == "$DIGEST" ]]
      env:
        DIGEST: ${{ needs.validate.outputs.digest }}
        DATA: ${{ runner.temp }}/data
        HASHES: ${{ needs.validate.outputs.hashes }}
        MODE: candidate
    - name: Sign fixed destination and retain original RPM/build predicates
      run: |
        set -euo pipefail
        [[ -n "$COSIGN_PRIVATE_KEY" ]]
        image="ghcr.io/bearyjd/bazzite-tower-r13-candidate@$DIGEST"
        cosign sign -y --key env://COSIGN_PRIVATE_KEY "$image"
        cosign sign -y --new-bundle-format --key env://COSIGN_PRIVATE_KEY "$image"
        cosign attest -y --new-bundle-format --key env://COSIGN_PRIVATE_KEY --type spdxjson --predicate "$DATA/sbom.json" "$image"
        cosign attest -y --new-bundle-format --key env://COSIGN_PRIVATE_KEY --type https://github.com/bearyjd/bazzite-tower/attestations/r13-candidate-build/v1 \
          --predicate "$DATA/build-provenance.json" "$image"
      env:
        DIGEST: ${{ needs.validate.outputs.digest }}
        DATA: ${{ runner.temp }}/data
        HASHES: ${{ needs.validate.outputs.hashes }}
        MODE: candidate
        COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
        COSIGN_PASSWORD: ''
    - name: Attest original candidate build workflow provenance
      uses: actions/attest-build-provenance@9d57eef8c06cd9d6b433effeeb7a6a77b3ff94ad
      with:
        subject-name: ghcr.io/bearyjd/bazzite-tower-r13-candidate
        subject-digest: ${{ needs.validate.outputs.digest }}
        push-to-registry: true
    - name: Verify destination-bound signature, SPDX, original provenance and policy
      run: |
        set -euo pipefail
        image="ghcr.io/bearyjd/bazzite-tower-r13-candidate@$DIGEST"
        timeout 180 cosign verify --key "$DATA/cosign.pub" "$image" >/dev/null
        timeout 180 cosign verify-attestation --new-bundle-format --key "$DATA/cosign.pub" --type https://sigstore.dev/cosign/sign/v1 "$image" > "$RUNNER_TEMP/sign-v1.verified.json"
        timeout 180 cosign verify-attestation --new-bundle-format --key "$DATA/cosign.pub" --type spdxjson "$image" > "$RUNNER_TEMP/sbom.verified.json"
        timeout 180 cosign verify-attestation --new-bundle-format --key "$DATA/cosign.pub" --type https://github.com/bearyjd/bazzite-tower/attestations/r13-candidate-build/v1 "$image" > "$RUNNER_TEMP/provenance.verified.json"
        python3 - <<'PY'
        import base64,json,os,pathlib
        root=pathlib.Path(os.environ['RUNNER_TEMP']); data=pathlib.Path(os.environ['DATA'])
        for name,file,kind in [('sbom','sbom.json','https://spdx.dev/Document'),('provenance','build-provenance.json','https://github.com/bearyjd/bazzite-tower/attestations/r13-candidate-build/v1'),('sign-v1',None,'https://sigstore.dev/cosign/sign/v1')]:
            verified=[json.loads(line) for line in (root/(name+'.verified.json')).read_text().splitlines() if line.strip()]
            expected=json.loads((data/file).read_bytes()) if file else None
            assert any((lambda v:v['predicateType']==kind and (file is None or v['predicate']==expected) and any(s['digest']=={'sha256':os.environ['DIGEST'][7:]} and (file is None or s['name']==os.environ['DESTINATION']) for s in v['subject']))(json.loads(base64.b64decode(item['payload'],validate=True))) for item in verified)
        PY
        # Source policy still verifies signatures; local OCI cannot store them.
        skopeo --policy "$RUNNER_TEMP/r13-trust/policy.json" --registries.d "$RUNNER_TEMP/r13-trust/registries.d" \
          copy --all --preserve-digests --remove-signatures --digestfile "$RUNNER_TEMP/policy.digest" "docker://$image" "oci:$RUNNER_TEMP/policy-verified:r13"
        [[ "$(cat "$RUNNER_TEMP/policy.digest")" == "$DIGEST" ]]
        gh attestation verify "oci://$image" --repo bearyjd/bazzite-tower \
          --signer-workflow bearyjd/bazzite-tower/.github/workflows/r13-candidate.yml \
          --source-digest "$GITHUB_SHA" --source-ref refs/heads/ci/r13-candidate-hold-promotion --deny-self-hosted-runners
      env:
        DIGEST: ${{ needs.validate.outputs.digest }}
        DATA: ${{ runner.temp }}/data
        HASHES: ${{ needs.validate.outputs.hashes }}
        MODE: candidate
        DESTINATION: ghcr.io/bearyjd/bazzite-tower-r13-candidate
        GH_TOKEN: ${{ github.token }}
      timeout-minutes: 20
    - name: Publish fixed candidate pointer after destination policy PASS
      run: |
        set -euo pipefail
        skopeo copy --all --preserve-digests --digestfile "$RUNNER_TEMP/public.digest" \
          "docker://ghcr.io/bearyjd/bazzite-tower-r13-candidate@$DIGEST" "docker://ghcr.io/bearyjd/bazzite-tower-r13-candidate:r13-candidate"
        [[ "$(cat "$RUNNER_TEMP/public.digest")" == "$DIGEST" ]]
        echo "CANDIDATE_POLICY_PASS repository=ghcr.io/bearyjd/bazzite-tower-r13-candidate digest=$DIGEST head=$GITHUB_SHA run=$GITHUB_RUN_ID" >> "$GITHUB_STEP_SUMMARY"
      env:
        DIGEST: ${{ needs.validate.outputs.digest }}
        DATA: ${{ runner.temp }}/data
        HASHES: ${{ needs.validate.outputs.hashes }}
        MODE: candidate
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: r13-destination-policy-receipt
        path: |-
          ${{ runner.temp }}/*.verified.json
          ${{ runner.temp }}/*.digest
        if-no-files-found: error
        retention-days: 30
        compression-level: 0
