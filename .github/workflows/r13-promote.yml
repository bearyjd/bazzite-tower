# Minimal fixed-digest promoter. It re-signs one already-built, already-tested
# image under the stable repository and moves only :snitchwatch-system to it.
# Runtime evidence and review are recorded in the PR and release notes, not in
# workflow variables. See docs/r13-publication.md.
name: r13 fixed-digest promotion
on:
  workflow_dispatch:
    inputs:
      digest:
        description: Must equal the fixed r13 candidate digest in this workflow
        required: true
        type: string

concurrency:
  # Every stable OCI writer shares this lock (see build.yml).
  group: bazzite-tower-stable-writers
  cancel-in-progress: false

permissions: {}

env:
  SOURCE: ghcr.io/bearyjd/bazzite-tower-r13-candidate
  DEST: ghcr.io/bearyjd/bazzite-tower
  DIGEST: sha256:88f8ff0052c27fcc71379f2b43e06ddd7218419b2d90c8fcf8392af5292b8454
  TAG: snitchwatch-system

jobs:
  promote:
    name: Promote fixed r13 digest
    if: github.repository == 'bearyjd/bazzite-tower' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # Lets the owner attach protection rules (required reviewer, main-only
    # deployment branches) to the `release` environment. Referencing a missing
    # environment creates it with no protection, so set them in Settings ->
    # Environments -> release. Protection gates this job's start; it does not
    # hide the repository-level signing secret from other workflows.
    environment: release
    # No checkout: this job holds the signing key. Trust files come from the
    # API at the dispatched commit instead.
    permissions:
      contents: read
      packages: write
    steps:
      - name: Require the fixed digest
        env:
          INPUT_DIGEST: ${{ inputs.digest }}
        run: |
          [[ "${INPUT_DIGEST}" == "${DIGEST}" ]] || {
            echo "::error::input digest '${INPUT_DIGEST}' is not the fixed digest ${DIGEST}"
            exit 1
          }

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v2.6.3'

      - name: Login to GitHub Container Registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The host's own signature policy, with only keyPath pointed at the
      # fetched key. Passing it to skopeo later proves `bootc switch` accepts
      # the image.
      - name: Fetch host signature policy and public key
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          trust="${RUNNER_TEMP}/trust"
          mkdir -p "${trust}/registries.d"
          fetch() {
            gh api -H 'Accept: application/vnd.github.raw+json' \
              "repos/${GITHUB_REPOSITORY}/contents/$1?ref=${GITHUB_SHA}" > "$2"
          }
          fetch cosign.pub "${trust}/cosign.pub"
          fetch system_files/usr/share/bazzite-tower/containers/policy.json "${trust}/host-policy.json"
          fetch system_files/usr/share/bazzite-tower/containers/registries.d/bazzite-tower.yaml \
            "${trust}/registries.d/bazzite-tower.yaml"
          jq -e --arg dest "${DEST}" '.default == [{"type":"reject"}] and .transports.docker[$dest] == [{"type":"sigstoreSigned","keyPath":"/etc/pki/containers/bazzite-tower-cosign.pub","signedIdentity":{"type":"matchRepository"}}]' \
            "${trust}/host-policy.json" >/dev/null
          jq --arg dest "${DEST}" --arg key "${trust}/cosign.pub" \
            '.transports.docker[$dest][0].keyPath = $key' "${trust}/host-policy.json" > "${trust}/policy.json"

      # The candidate repository also carries certificate-based GitHub
      # provenance attestations; --new-bundle-format with --key selects the
      # key-signed SPDX one instead of failing with "expected key signature,
      # not certificate".
      - name: Verify the source is key-signed with an SPDX attestation
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          trust="${RUNNER_TEMP}/trust"
          image="${SOURCE}@${DIGEST}"
          # Bound each command so a stuck lookup reports what it was doing.
          # Callers redirect stdout: cosign prints the verified payload there,
          # which for SPDX is the whole base64 document and stalled log
          # streaming on an earlier run.
          run_bounded() {
            echo "+ $*" >&2
            timeout 180 "$@" && return 0
            rc=$?
            echo "::error::'$*' exited ${rc} (124 = no answer within 180 s)"
            return "${rc}"
          }
          run_bounded cosign verify --key "${trust}/cosign.pub" "${image}" >/dev/null
          run_bounded cosign verify-attestation --new-bundle-format --key "${trust}/cosign.pub" \
            --type spdxjson "${image}" > "${RUNNER_TEMP}/source-attestations.json"
          # Keep only the SPDX predicate whose subject is the fixed digest.
          jq -c --arg d "${DIGEST#sha256:}" '(if has("payload") then (.payload | @base64d | fromjson) else . end) | select(.predicateType == "https://spdx.dev/Document" and any(.subject[]; .digest.sha256 == $d)) | .predicate' \
            "${RUNNER_TEMP}/source-attestations.json" | sort -u > "${RUNNER_TEMP}/spdx.json"
          [[ "$(wc -l < "${RUNNER_TEMP}/spdx.json")" -eq 1 ]] || {
            echo "::error::expected exactly one verified SPDX predicate for ${DIGEST}"
            exit 1
          }
          jq -e '.spdxVersion | startswith("SPDX-")' "${RUNNER_TEMP}/spdx.json" >/dev/null
          # Bind the digest to the reviewed product commit through the candidate
          # workflow's GitHub build provenance (same check as r13-immutable-ci).
          run_bounded gh attestation verify "oci://${image}" --repo bearyjd/bazzite-tower \
            --signer-workflow bearyjd/bazzite-tower/.github/workflows/r13-candidate.yml \
            --source-digest b2f6e24131de06117a00fb727e5cb7166d4e77da \
            --source-ref refs/heads/ci/r13-candidate-hold-promotion --deny-self-hosted-runners >/dev/null

      - name: Copy the digest into the stable repository under a staging tag
        env:
          STAGING_TAG: r13-promotion-${{ github.run_id }}
        # The staging tag is deliberately never deleted: GHCR deletes whole
        # package versions, and this version also carries :snitchwatch-system
        # after promotion. See docs/r13-publication.md.
        run: |
          set -euo pipefail
          skopeo copy --all --preserve-digests --digestfile "${RUNNER_TEMP}/staged.digest" \
            "docker://${SOURCE}@${DIGEST}" "docker://${DEST}:${STAGING_TAG}"
          [[ "$(cat "${RUNNER_TEMP}/staged.digest")" == "${DIGEST}" ]]

      - name: Sign the digest and re-attest the verified SPDX predicate
        run: |
          set -euo pipefail
          [[ -n "${COSIGN_PRIVATE_KEY}" ]]
          cosign sign -y --key env://COSIGN_PRIVATE_KEY "${DEST}@${DIGEST}"
          cosign attest -y --key env://COSIGN_PRIVATE_KEY --type spdxjson \
            --predicate "${RUNNER_TEMP}/spdx.json" "${DEST}@${DIGEST}"
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          COSIGN_PASSWORD: ""

      # The destination carries only the plain key-signed signature and
      # attestation written above, so this is build.yml's own verify form.
      - name: Verify the destination signature, SPDX and host policy
        timeout-minutes: 10
        run: |
          set -euo pipefail
          trust="${RUNNER_TEMP}/trust"
          image="${DEST}@${DIGEST}"
          run_bounded() {
            echo "+ $*" >&2
            timeout 180 "$@" && return 0
            rc=$?
            echo "::error::'$*' exited ${rc} (124 = no answer within 180 s)"
            return "${rc}"
          }
          run_bounded cosign verify --key "${trust}/cosign.pub" "${image}" >/dev/null
          skopeo --version
          run_bounded cosign verify-attestation --key "${trust}/cosign.pub" \
            --type spdxjson "${image}" >/dev/null
          skopeo --policy "${trust}/policy.json" --registries.d "${trust}/registries.d" \
            copy --all --preserve-digests --remove-signatures --digestfile "${RUNNER_TEMP}/host-policy-image.digest" \
            "docker://${image}" "oci:${RUNNER_TEMP}/host-policy-image:r13"
          [[ "$(cat "${RUNNER_TEMP}/host-policy-image.digest")" == "${DIGEST}" ]]
          # The tag check below downloads the image again; free the runner disk.
          rm -r "${RUNNER_TEMP}/host-policy-image"

      # The only step that moves a public tag, and only after every check above.
      - name: Move the system tag
        run: |
          set -euo pipefail
          skopeo copy --all --preserve-digests --digestfile "${RUNNER_TEMP}/tag.digest" \
            "docker://${DEST}@${DIGEST}" "docker://${DEST}:${TAG}"
          [[ "$(cat "${RUNNER_TEMP}/tag.digest")" == "${DIGEST}" ]]

      - name: Verify the moved tag
        timeout-minutes: 10
        run: |
          set -euo pipefail
          trust="${RUNNER_TEMP}/trust"
          resolved="sha256:$(skopeo inspect --raw "docker://${DEST}:${TAG}" | sha256sum | cut -d' ' -f1)"
          [[ "${resolved}" == "${DIGEST}" ]] || {
            echo "::error::${DEST}:${TAG} resolves to ${resolved}, expected ${DIGEST}"
            exit 1
          }
          skopeo --policy "${trust}/policy.json" --registries.d "${trust}/registries.d" \
            copy --all --preserve-digests --remove-signatures --digestfile "${RUNNER_TEMP}/host-policy-tag.digest" \
            "docker://${DEST}:${TAG}" "oci:${RUNNER_TEMP}/host-policy-tag:r13"
          [[ "$(cat "${RUNNER_TEMP}/host-policy-tag.digest")" == "${DIGEST}" ]]
          {
            echo "### r13 promotion"
            echo "- \`${DEST}:${TAG}\` -> \`${DIGEST}\`"
            echo "- source \`${SOURCE}\`, re-signed with the repository key; host signature policy accepted the tag"
          } >> "${GITHUB_STEP_SUMMARY}"
