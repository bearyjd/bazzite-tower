# bazzite-tower-bluetooth-resume-guard (system-sleep/) can restart this
# service twice in a row during resume, and systemd-sleep blocks the whole
# system's resume until that hook script exits. systemd's own default
# per-service stop/start timeout is long enough that a wedged bluetoothd
# could hold resume open for minutes across two restarts. Bound both tightly
# instead -- 10s is generous for a daemon this small, and a restart that
# can't complete in that window isn't going to recover cleanly anyway.
[Service]
TimeoutStartSec=10
TimeoutStopSec=10
