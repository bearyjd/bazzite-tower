# Block the Looking Glass kvmfr module (owner decision 2026-11-23: no longer used).
# Safe to revert: delete this file (see "Re-enable" below).
#
# The module itself (kmod-kvmfr) comes from the Bazzite base, not this repo, so its
# files stay on disk and the owner can still load it by hand. `install kvmfr
# /bin/false` makes every modprobe-based load fail (modules-load.d, alias
# autoload, explicit `modprobe kvmfr`); `blacklist` additionally stops udev alias
# autoload.
#
# Re-enable by hand for one boot (UNVERIFIED on the host):
#   sudo modprobe --ignore-install kvmfr static_size_mb=128
#   sudo chgrp qemu /dev/kvmfr0; sudo chmod 0660 /dev/kvmfr0   # the udev rule is gone
# Permanent re-enable: delete this file and restore the kvmfr.static_size_mb=128
# karg (kargs.d/30-vfio-kvm.toml) and 70-kvmfr.rules via `git revert` of the
# commit that disabled kvmfr.
install kvmfr /bin/false
blacklist kvmfr
