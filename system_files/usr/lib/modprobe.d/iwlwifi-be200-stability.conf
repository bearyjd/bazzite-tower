# Intel Wi-Fi 7 BE200 stability (safe to revert: delete this file).
#
# The BE200 firmware on this machine asserts and takes the chip down with it:
#
#   iwlwifi: Error sending SYSTEM_STATISTICS_CMD: time out after 2000ms.
#   iwlwifi: 0x00000084 | NMI_INTERRUPT_UNKNOWN
#   iwlwifi: 0x20000066 | NMI_INTERRUPT_HOST
#   iwlwifi: Device error - SW reset
#   ieee80211 phy0: Hardware restart was requested
#
# The host sends a routine statistics command, the firmware never answers, both
# its processors take an NMI, and the driver hard-resets the device. Recovery
# takes 5-15s. Wi-Fi is this machine's ONLY uplink (no ethernet port), so for
# that window every network-dependent process blocks and the desktop appears
# frozen. Observed 4x in 5 hours on 2026-08-28, on firmware
# 101.6e695a70.0 gl-c0-fm-c0-c101.ucode, kernel 6.19.11, op_mode iwlmld.
#
# Note this is NOT caught by any kernel watchdog: the soft-lockup watchdog only
# fires on a CPU spinning in kernel mode, and hung_task only after 120s. The
# CPU is never stalled — only network I/O blocks. The iwlwifi error log is the
# only reliable signal, which is why the journal retention cap matters (see
# 90-tower-journal-cap.conf; the old 500M cap evicted the evidence).
#
# disable_11be   - drop EHT/Wi-Fi 7 rates; the 11be paths are the least mature.
# power_save     - mac80211-level power save off.
# uapsd_disable  - no U-APSD; its sleep/wake handshake is a known trouble spot.
# power_scheme=1 - CAM (continuously awake). THIS IS THE ONE THAT WAS MISSING:
#                  iwlmld carries its own power scheme, independent of
#                  iwlwifi.power_save, and it defaults to 2 (balanced, firmware
#                  sleeps). Power-save sleep/wake transitions are the suspected
#                  trigger for the assert above. Costs idle battery; on a
#                  desktop-replacement P1 that is the right trade.
#
# Verify live:  cat /sys/module/iwlmld/parameters/power_scheme   -> 1
# Count asserts: journalctl -k -b 0 | grep -c "Device error - SW reset"
options iwlwifi disable_11be=1
options iwlwifi power_save=0
options iwlwifi uapsd_disable=1
options iwlmld power_scheme=1
