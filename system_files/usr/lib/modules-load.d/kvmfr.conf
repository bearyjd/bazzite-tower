# Overrides the Bazzite base's /usr/lib/modules-load.d/kvmfr.conf (same path, so this
# copy replaces it at image build). The base loads kvmfr at every boot; we block it
# (modprobe.d/disable-kvmfr.conf), and a boot-time load that hits `install kvmfr
# /bin/false` would leave systemd-modules-load.service failed. Owner decision 2026-11-23.
# To re-enable: git revert the commit that disabled kvmfr.
