# Bound the persistent systemd journal by SIZE and by TIME.
#
# The default SystemMaxUse is 10% of the filesystem — on this 7.3 TiB box that's
# ~730 GiB, so a log storm (e.g. the SOF audio retry loop that wrote 94k+ lines
# per boot, or a crash-looping unit) can balloon the journal to multiple GiB
# before old entries age out. journald enforces SystemMaxUse continuously: it
# vacuums older journal files on every rotation to stay under the limit, so this
# replaces any need for a periodic `journalctl --vacuum-size` cron/timer.
#
# 2026-08-28: raised 500M -> 4G. 500M was too aggressive and actively harmful.
# It vacuumed away ALL kernel messages from prior boots within hours, which hid
# a recurring BE200 Wi-Fi firmware assert (see
# /usr/lib/modprobe.d/iwlwifi-be200-stability.conf) and made a long-standing
# problem look like it had started that day. Intermittent hardware faults can
# only be diagnosed against weeks of history; a cap that cannot hold a week of
# logs defeats the purpose of having a persistent journal at all.
#
# 4G is ~0.05% of this disk. The real protection against a runaway log is now
# the TIME bound (MaxRetentionSec) plus daily file rotation (MaxFileSec), which
# bound growth without destroying the forensic trail. Size is the backstop.
#
# Verify live with `journalctl --disk-usage`. Override at /etc/systemd/journald.conf.d/.
[Journal]
SystemMaxUse=4G
SystemKeepFree=10G
MaxRetentionSec=1month
MaxFileSec=1day
