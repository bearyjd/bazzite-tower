[Unit]
# A pending deny trial must be reverted before the firewall starts. If the guard
# FAILS, opensnitch does not start at all: the network stays open instead of
# locked by an unconfirmed deny. When the guard's ConditionPathExists is unmet
# (no trial) the guard is skipped, which systemd.unit(5) treats as success for
# Requires= (documented behaviour; not exercised on a real boot here).
Requires=bazzite-tower-snitchwatch-deny-guard.service
After=bazzite-tower-snitchwatch-deny-guard.service
