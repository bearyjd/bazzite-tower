# opensnitch.service drop-in for the Snitchwatch system bridge (#35).
# Staged by stage.sh with the socket it dials and the daemon config that
# dials it. The daemon's `Server.Address: unix:opensnitchd.sock` is relative
# and resolves in this working directory, after systemd has created the
# root-only listener. (Whether 1.8.0 accepts the absolute unix:/// form
# instead is unverified: docs/packaging/system-bridge-integration.md.)
#
# Wants=, not Requires= (PR #166 M1, owner decision), and a working
# directory that may be missing, so a failed socket never keeps the daemon
# from starting. It then has no UI to dial and applies its DefaultAction:
# `allow` as shipped (owner decision 2026-10-25), `deny` only if the operator
# opted in. Recovery: docs/packaging/system-bridge-integration.md.
[Unit]
Wants=snitchwatch-system-bridge-grpc.socket
After=snitchwatch-system-bridge-grpc.socket

[Service]
WorkingDirectory=-/run/snitchwatch
