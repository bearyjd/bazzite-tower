# Snitchwatch: share this computer's connection events with Vigie (opt-in).
#
# The whole configuration of a SEPARATE rsyslog instance,
# snitchwatch-endpoint-events.service (never the host's rsyslog, never
# /etc/rsyslog.d). Install as /etc/snitchwatch-endpoint-events/rsyslog.conf
# only by following packaging/endpoint-events/README.md. Replace the three
# @...@ placeholders first; rsyslog won't start with them in place. The three files under
# /etc/pki/snitchwatch-endpoint-events/ must exist: Vigie's CA, and this
# computer's client certificate and key (mutual TLS; see the README).
#
#   opensnitchd --(remote logger, JSON lines, TCP 127.0.0.1:514)--> this file
#     --(allowlisted fields only, mutual TLS, pinned CA)--> Vigie
#
# Privacy: the daemon's raw event carries each process's environment,
# arguments, working directory, process tree and checksums. Those never leave
# this computer through this forward: the template below names only the
# allowlisted fields, so everything else is dropped here. Never run rsyslog
# with debug output (-d / RSYSLOG_DEBUG) on this host: it prints raw events.
#
# Provenance: only root may connect to 127.0.0.1:514
# (snitchwatch-endpoint-events.nft); every forwarded field is validated
# below and anything that fails is dropped. Root on this host can still forge
# events, so Vigie must read them as "reported by this host", nothing more.
#
# Comments in this file use `#` only (the packaging_shape tests rely on it).

# Size limits.
# - In: the daemon's raw line carries the whole process environment and
#   arguments, often beyond rsyslog's 8k default. A truncated line fails to
#   parse and would be silently dropped, so accept up to 64k (this is
#   rsyslog-wide; larger events are truncated and dropped).
# - Out: Vigie drops frames over 8 KiB. The ruleset drops (never truncates,
#   which could split a UTF-8 character) any event whose fields exceed their
#   caps: process_path 768 bytes, rule 128 bytes, dst_host 253 ASCII
#   characters, the rest short by pattern. Even if every byte of the path and
#   rule needs six-byte escaping, a frame stays under 8 KiB, given a host id
#   of at most 64 characters.
#
# abortOnUncleanConfig: any config error and this instance refuses to start,
# so the listener never opens with a missing or broken ruleset (rsyslog would
# otherwise route it to the default ruleset). This instance's default ruleset
# has no actions either, so nothing here can reach the journal or /var/log.
global(workDirectory="/var/lib/rsyslog/snitchwatch-endpoint-events"
       maxMessageSize="64k" abortOnUncleanConfig="on")

module(load="imtcp")
module(load="mmjsonparse")

# Loopback only, on the port the daemon's logger dials. 514 is below
# net.ipv4.ip_unprivileged_port_start, so no unprivileged process can bind it
# first and receive the stream (#35); snitchwatch-endpoint-events.nft lets
# only root connect.
input(type="imtcp" address="127.0.0.1" port="514"
      ruleset="snitchwatch_endpoint_events"
      supportOctetCountedFraming="off")

# One JSON object per forwarded frame, allowlisted fields only. `time` is when
# rsyslog received the event from the daemon, RFC 3339 (the daemon's JSON
# carries no timestamp). `host_id` is informational: Vigie identifies this
# computer by its client certificate.
# rsyslog lowercases outnames, so the daemon's Action/Rule/Type go out as
# action/rule/type; they're written lowercase here to match the wire.
template(name="snitchwatch_endpoint_event" type="list" option.jsonf="on") {
    property(outname="time" name="timegenerated" dateFormat="rfc3339" format="jsonf")
    constant(outname="host_id" value="@HOST_ID@" format="jsonf")
    property(outname="protocol" name="$!Event!protocol" format="jsonf")
    property(outname="src_ip" name="$!Event!src_ip" format="jsonf")
    property(outname="src_port" name="$!Event!src_port" format="jsonf" datatype="number")
    property(outname="dst_ip" name="$!Event!dst_ip" format="jsonf")
    property(outname="dst_port" name="$!Event!dst_port" format="jsonf" datatype="number")
    property(outname="dst_host" name="$!Event!dst_host" format="jsonf")
    property(outname="process_path" name="$!Event!process_path" format="jsonf")
    property(outname="user_id" name="$!Event!user_id" format="jsonf" datatype="number")
    property(outname="action" name="$!Action" format="jsonf")
    property(outname="rule" name="$!Rule" format="jsonf")
    property(outname="type" name="$!Type" format="jsonf" datatype="number")
}

# Its own queue, so raw events (environment included) never pass through the
# main queue, which a host may have made disk-assisted. Memory only, bounded,
# never saved: when full, new events are dropped at once.
ruleset(name="snitchwatch_endpoint_events"
        queue.type="LinkedList" queue.size="10000"
        queue.timeoutEnqueue="0" queue.saveOnShutdown="off") {
    # The daemon sends bare JSON lines, no syslog header, so parse the raw
    # line (Fedora ships no pmnull) with an empty cookie.
    action(type="mmjsonparse" cookie="" useRawMsg="on")
    if $parsesuccess != "OK" then stop

    # The daemon omits zero numbers (protobuf omitempty): a missing port is 0
    # (ICMP), a missing user_id is root.
    if $!Event!src_port == "" then { set $!Event!src_port = 0; }
    if $!Event!dst_port == "" then { set $!Event!dst_port = 0; }
    if $!Event!user_id == "" then { set $!Event!user_id = 0; }

    # Forward only connection events (Type 0) whose every forwarded field has
    # the expected shape and size. Anything else (blank frames, non-JSON,
    # task notifications, oversize or malformed fields) is dropped by the
    # `stop` below and never forwarded. These are shape and size checks, not
    # a schema: an IPv6 address is only checked for its characters and
    # length, and a rule name only for its length. Vigie must validate too.
    #
    # - protocol: what conman/connection.go emits ("tcp", "udp", "udplite",
    #   "sctp", "icmp", each optionally with "6").
    # - IPs: dotted-quad IPv4 with octets up to 255, or IPv6 characters with
    #   at least one ':' (Go's net.IP.String() is lowercase).
    # - process_path: an absolute path up to 768 bytes, empty, the daemon's
    #   "Kernel connection" marker, or the process comm it falls back to when
    #   the executable can't be resolved (procmon/details.go:258-275; Linux
    #   caps comm at 15 bytes). comm is checked by length only: it may hold
    #   any byte (a tab, a quote), and jsonf escapes it. The bound is 45, not
    #   15: when the kernel's cut splits a UTF-8 character, Go's json.Marshal
    #   replaces each invalid byte with U+FFFD (3 bytes).
    # - user_id: a uint32, by pattern (a RainerScript number literal can't
    #   hold 4294967295: `cnum(x) <= 4294967295` is false even for 1000).
    if re_match($!Type, "^0\$")
       and re_match($!Event!protocol, "^(tcp|udp|udplite|sctp|icmp)6?\$")
       and (re_match($!Event!src_ip, "^((25[0-5]|2[0-4][0-9]|1?[0-9]?[0-9])[.]){3}(25[0-5]|2[0-4][0-9]|1?[0-9]?[0-9])\$")
            or (re_match($!Event!src_ip, "^[0-9a-f:.]{2,45}\$") and re_match($!Event!src_ip, ":")))
       and re_match($!Event!src_port, "^[0-9]{1,5}\$") and cnum($!Event!src_port) <= 65535
       and (re_match($!Event!dst_ip, "^((25[0-5]|2[0-4][0-9]|1?[0-9]?[0-9])[.]){3}(25[0-5]|2[0-4][0-9]|1?[0-9]?[0-9])\$")
            or (re_match($!Event!dst_ip, "^[0-9a-f:.]{2,45}\$") and re_match($!Event!dst_ip, ":")))
       and re_match($!Event!dst_port, "^[0-9]{1,5}\$") and cnum($!Event!dst_port) <= 65535
       and re_match($!Event!dst_host, "^[A-Za-z0-9._:-]{0,253}\$")
       and ((re_match($!Event!process_path, "^(/|\$)") and strlen($!Event!process_path) <= 768)
            or $!Event!process_path == "Kernel connection"
            or strlen($!Event!process_path) <= 45)
       and re_match($!Event!user_id, "^([0-9]{1,9}|[1-3][0-9]{9}|4[01][0-9]{8}|42[0-8][0-9]{7}|429[0-3][0-9]{6}|4294[0-8][0-9]{5}|42949[0-5][0-9]{4}|429496[0-6][0-9]{3}|4294967[01][0-9]{2}|42949672[0-8][0-9]|429496729[0-5])\$")
       and re_match($!Action, "^(allow|deny|reject|<nil>)\$")
       and strlen($!Rule) <= 128
    then {
        # Port 6514 (syslog over TLS) is the only port this recipe supports:
        # SELinux already lets rsyslog connect to it (syslog_tls_port_t). Any
        # other port is the operator's decision, outside the recipe (README).
        #
        # Mutual TLS, mandatory (mode 1): Vigie must present a certificate
        # signed by the pinned CA with this name, and this computer presents
        # its own client certificate, which is how Vigie identifies it.
        #
        # Queue: in memory only, bounded. When it's full (Vigie unreachable
        # for long), new events are dropped at once rather than blocking the
        # listener; the daemon drops them too while rsyslog is down. There is
        # deliberately no disk-assisted queue: it would write the whole raw
        # event, environment and arguments included, to disk.
        action(type="omfwd" name="snitchwatch_to_vigie"
               target="@VIGIE_ADDRESS@" port="6514" protocol="tcp"
               template="snitchwatch_endpoint_event"
               tcp_framing="octet-counted"
               StreamDriver="gtls" StreamDriverMode="1"
               StreamDriverAuthMode="x509/name"
               StreamDriverPermittedPeers="@VIGIE_CERT_NAME@"
               streamDriver.CAFile="/etc/pki/snitchwatch-endpoint-events/vigie-ca.pem"
               streamDriver.CertFile="/etc/pki/snitchwatch-endpoint-events/host-cert.pem"
               streamDriver.KeyFile="/etc/pki/snitchwatch-endpoint-events/host-key.pem"
               queue.type="LinkedList" queue.size="10000"
               queue.timeoutEnqueue="0" queue.saveOnShutdown="off"
               action.resumeRetryCount="-1" action.resumeInterval="10")
    }
    stop
}
