# Root owns both runtime parents.  The 0711 socket parent permits lookup but
# not listing or replacement by a desktop user or the bridge account.
d /run/snitchwatch 0711 root root -
# setgid gives the bridge-created compatibility token the UI group while the
# bridge keeps its private primary group.  The token is compatibility-only:
# access to bridge.sock is the authorization boundary.
d /run/snitchwatch-auth 2750 snitchwatch snitchwatch-ui -

